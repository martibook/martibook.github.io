        <!--Bootstrap 5 bundle (Popper included; no jQuery needed)-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function hideBrand() {
                var e = document.getElementById("brand");
                e.style.display = "none";
            }

            function removeReadsChildren() {
                var e = document.getElementById("reads");
                var child = e.lastElementChild;  
                while (child) { 
                    e.removeChild(child); 
                    child = e.lastElementChild; 
                } 
            }

            function showReads(name) {

                removeReadsChildren();

                hideBrand();  

                var e = document.getElementById("reads");
                e.style.display = "block";

                // test locally
//                 let text = 
//                     `
// 一些中文

// pretty long line xxxxxxxxxxxxxxxxx xxxxxxxxxxxxxxxxxxxxxxxxxx xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx xxxxxxxxxxxxxxx xxxxxxxxxxxxxxxx xxxxxxxxxxxxxx xxxxxxxxxxxxxx
// `;
//                 var p = document.createElement('pre');
//                 p.textContent = text;
//                 e.appendChild(p);

                fetch(`./reads/${name}.txt`)
                    .then((response) => response.text())
                    .then((text) => {
                        var p = document.createElement('pre');
                        p.textContent = text;
                        e.appendChild(p);
                    });
            }

            function showReadsEachLine(name) {

                removeReadsChildren();

                hideBrand();  

                var e = document.getElementById("reads");
                e.style.display = "block";

                // test locally
                // let contents = [
                //     'xxxxxxxxxxxxxxxxxxxxxxxxxxxx',
                //     'mmmmmmmmm',
                //     'nnnnnnnnnnnnnnnnnnnnnnnn'
                // ]
                // for (const text of contents) {
                //     var p = document.createElement('p');
                //     p.textContent = text;
                //     e.appendChild(p);
                // }

                fetch(`./reads/${name}.txt`)
                    .then((response) => response.text())
                    .then((text) => {
                        const contents = text.split('\n');
                        for (const text of contents) {
                            var p = document.createElement('p');
                            p.textContent = text;
                            e.appendChild(p);
                        }
                    });
            }
        </script>
